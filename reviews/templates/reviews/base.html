<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы о предприятиях Мариуполя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* ========== ПЕРЕМЕННЫЕ СВЕТЛОЙ ТЕМЫ (по умолчанию) ========== */
    :root {
        --bg-body: #f8f9fa;
        --bg-card: #ffffff;
        --text-primary: #212529;
        --text-secondary: #6c757d;
        --border-color: #dee2e6;
        --navbar-bg: #212529;
        --footer-bg: #f8f9fa;
        --footer-text: #6c757d;
        --link-color: #0d6efd;
    }

    /* ========== ТЁМНАЯ ТЕМА ========== */
    body.dark-theme {
        --bg-body: #1a1a2e;
        --bg-card: #16213e;
        --text-primary: #eaeef2;
        --text-secondary: #a0aec0;
        --border-color: #2d3748;
        --navbar-bg: #0f3460;
        --footer-bg: #0f3460;
        --footer-text: #a0aec0;
        --link-color: #3b82f6;
    }

    /* ========== ПРИМЕНЕНИЕ ПЕРЕМЕННЫХ ========== */
    body {
        background-color: var(--bg-body);
        color: var(--text-primary);
        transition: background-color 0.3s, color 0.3s;
        padding-top: 0px; /* как у вас */
    }

    /* Карточки */
    .card {
        background-color: var(--bg-card);
        border-color: var(--border-color);
        color: var(--text-primary);
    }
    .card-body {
        background-color: var(--bg-card);
    }

    /* Текст muted */
    .text-muted {
        color: var(--text-secondary) !important;
    }

    /* Футер */
    footer {
        margin-top: 50px;
        text-align: center;
        padding: 20px;
        background-color: var(--footer-bg);
        color: var(--footer-text);
    }

    /* Навигация (Bootstrap .navbar-dark переопределяется через important) */
    .navbar-dark {
        background-color: var(--navbar-bg) !important;
    }

    /* Ссылки */
    a {
        color: var(--link-color);
    }
    a:hover {
        filter: brightness(0.9);
    }

    /* Ваши кастомные классы */
    .rating-stars {
        color: #ffc107;
    }
    .pre-line {
        white-space: pre-line;
    }

    /* Карточки одинаковой высоты */
    .row-cards {
        display: flex;
        flex-wrap: wrap;
    }
    .card {
        height: 100%;
        display: flex;
        flex-direction: column;
    }
    .card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .review-wrapper {
        flex-grow: 1;
    }

    /* Таблицы и дополнительные элементы */
    .table {
        color: var(--text-primary);
    }
    .table-striped > tbody > tr:nth-of-type(odd) > * {
        background-color: rgba(255, 255, 255, 0.05);
    }
    .bg-light {
        background-color: var(--bg-card) !important;
    }
    .border-primary {
        border-color: #0d6efd !important;
    }
    .btn-outline-light {
        border-color: var(--navbar-text);
        color: var(--navbar-text);
    }
    .btn-outline-light:hover {
        background-color: rgba(255,255,255,0.1);
    }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">📋 Отзывы Мариуполя</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'stats' %}">📊 Статистика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'ya_map' %}">🗺️ Карта</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add_review' %}">➕ Оставить отзыв</a>                
                <li class="nav-item">
                    <button id="theme-toggle" class="btn btn-outline-secondary ms-2 mt-2 mt-lg-0">🌙 Тёмная</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p class="text-muted">Анонимный портал отзывов о предприятиях сферы услуг г. Мариуполя</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Проверяем сохранённую тему в localStorage
    const currentTheme = localStorage.getItem('theme');
    if (currentTheme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-toggle').textContent = '☀️ Светлая';
    } else {
        document.body.classList.remove('dark-theme');
        document.getElementById('theme-toggle').textContent = '🌙 Тёмная';
    }

    // Обработчик кнопки
    document.getElementById('theme-toggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        this.textContent = isDark ? '☀️ Светлая' : '🌙 Тёмная';
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы о предприятиях Мариуполя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .rating-stars { color: #ffc107; }
        footer { margin-top: 50px; text-align: center; padding: 20px; background: #f8f9fa; }
        .pre-line 
        {
        white-space: pre-line;
        }
        
         /* Чтобы карточки в одной строке были одинаковой высоты */
        .row-cards 
        {
         display: flex;
         flex-wrap: wrap;
        }
        .card 
        {
         height: 100%;
         display: flex;
         flex-direction: column;
        }
        .card-body 
        {
         flex: 1;
         display: flex;
         flex-direction: column;
        }
       .review-wrapper 
       {
         flex-grow: 1;
       }

        body {
         padding-top: 0px; /* высота навигационной панели */
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">📋 Отзывы Мариуполя</a>
            <a class="nav-link" href="{% url 'stats' %}">📊 Статистика</a>
            <a class="nav-link" href="{% url 'ya_map' %}">🗺️ Карта</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'add_review' %}">➕ Оставить отзыв</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p class="text-muted">Анонимный портал отзывов о предприятиях сферы услуг г. Мариуполя</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
